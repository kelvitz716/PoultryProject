name: Build and Deploy to OCI

on:
  push:
    branches: [master]

# Lowercase image name — ghcr.io rejects mixed-case references.
env:
  IMAGE: ghcr.io/kelvitz716/poultryproject

jobs:
  # ── Job 1: Build a multi-arch image and push to GitHub Container Registry ──
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Required to push to ghcr.io

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # QEMU lets the amd64 runner emulate arm64 so we can produce a native
      # arm64 layer alongside amd64 in the same manifest.
      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      # Buildx is the engine behind multi-platform builds.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Build for both x86-64 servers AND the OCI Ampere A1 (ARM64) instance.
          # Docker on OCI will automatically select the arm64 layer — no emulation.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # ── Job 2: Copy updated config files and redeploy via Tailscale + SSH ──
  deploy:
    runs-on: ubuntu-latest
    needs: build   # Only runs after the image is successfully pushed

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Copy docker-compose.yml over SSH so OCI always has the latest version
      # without needing a git pull (OCI has no direct internet access to GitHub).
      - name: Sync docker-compose.yml to OCI
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 100.68.227.114
          username: opc
          key: ${{ secrets.OCI_SSH_KEY }}
          source: docker-compose.yml
          target: /home/opc/data/poultryproject/

      - name: Deploy new image on OCI via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 100.68.227.114
          username: opc
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: IMAGE
          script: |
            cd ~/data/poultryproject

            echo "Pulling native arm64 image from ghcr.io..."
            docker pull $IMAGE:latest

            echo "Restarting container with new image..."
            docker compose up -d --pull always --force-recreate poultry-dss

            echo "Pruning dangling images to free disk space..."
            docker image prune -f

            echo "=== Deploy complete. Container status: ==="
            docker ps --filter name=poultry-dss --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
