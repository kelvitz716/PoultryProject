version: '3.8'

services:
  poultry-dss:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poultry-dss
    ports:
      - "8089:80"
    restart: always
    volumes:
      # Specifically persist the SQLite database volume securely
      - ./data:/app/data
    env_file:
      - .env

