name: Build and Deploy to OCI

on:
  push:
    branches: [master]

# Define the lowercase image name once for the entire workflow.
# ghcr.io requires all-lowercase image references.
env:
  IMAGE: ghcr.io/kelvitz716/poultryproject

jobs:
  # ── Job 1: Build the Docker image and push it to GitHub Container Registry ──
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Required to push to ghcr.io

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tag with both the commit SHA (immutable) and :latest (rolling).
          # Using the env.IMAGE variable ensures the name is always lowercase,
          # avoiding the "invalid reference format" error from ghcr.io.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # ── Job 2: SSH into OCI via Tailscale and redeploy the new image ──
  deploy:
    runs-on: ubuntu-latest
    needs: build   # Only runs after the image is successfully pushed

    steps:
      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy new image on OCI via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 100.68.227.114
          username: opc
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: IMAGE
          # Pull the pre-built image from ghcr.io and recreate only the
          # poultry-dss container, leaving all other stacks untouched.
          # The GITHUB_TOKEN-published package is public by default.
          script: |
            cd ~/data/poultryproject

            echo "Pulling latest image..."
            docker pull $IMAGE:latest

            echo "Restarting container with new image..."
            docker compose up -d --pull always --force-recreate poultry-dss

            echo "Pruning dangling images to free disk space..."
            docker image prune -f

            echo "=== Deploy complete. Container status: ==="
            docker ps --filter name=poultry-dss --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
