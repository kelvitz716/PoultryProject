# docker-compose.yml — PoultryDSS Stack Definition
#
# Usage:
#   Production (OCI):  IMAGE_REF=ghcr.io/kelvitz716/poultryproject@sha256:<digest> docker compose up -d --pull never --no-build --force-recreate poultry-dss
#   Local source build: IMAGE_REF=poultry-dss:local docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d

services:
  poultry-dss:
    # ── Image ──────────────────────────────────────────────────────────────
    # In CI/CD deployments the GitHub Actions workflow pushes a pre-built
    # multi-arch image (linux/amd64 + linux/arm64) to ghcr.io and then
    # instructs OCI to pull it. OCI (Ampere A1, ARM64) automatically selects
    # the native arm64 layer from the manifest — no emulation overhead.
    #
    # Local source builds belong in docker-compose.dev.yml. Keeping production
    # image-only ensures the CI deployment actually runs the image it pulled.
    # IMAGE_REF is deliberately required: production deploys must name the
    # immutable manifest digest produced by the successful CI build.
    image: ${IMAGE_REF:?IMAGE_REF must be an immutable ghcr.io/kelvitz716/poultryproject@sha256 digest}

    container_name: poultry-dss

    # ── Port mapping ───────────────────────────────────────────────────────
    # The Express server binds to port 80 inside the container.
    # Host access is loopback-only. Tailscale Serve terminates HTTPS on the
    # host and proxies to this port; this container must never listen on the
    # public OCI interface.
    ports:
      - "127.0.0.1:8089:80"

    # ── Restart policy ─────────────────────────────────────────────────────
    # `always` ensures the container restarts automatically after an OCI
    # instance reboot or Docker daemon restart.
    restart: always

    # A real JSON readiness endpoint, not the SPA fallback. The process only
    # binds after SQLite schema initialization has completed.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/api/healthz').then(r => r.json()).then(b => { if (b.status !== 'ok') process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # ── Volumes ────────────────────────────────────────────────────────────
    # Bind-mounts the host ./data directory to /app/data inside the container.
    # This keeps the SQLite database (poultry.db) on the host filesystem so
    # it persists across container recreations and image upgrades.
    volumes:
      - ./data:/app/data

    # ── Environment ────────────────────────────────────────────────────────
    # Loads environment variables from the .env file in the project root.
    # Required keys: PORT, TUYA_CLIENT_ID, TUYA_CLIENT_SECRET,
    #                TUYA_DEVICE_ID, TUYA_REGION
    # See README.md for full variable reference.
    env_file:
      - .env
    environment:
      NODE_ENV: production
