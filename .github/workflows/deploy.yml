name: CI/CD kwa OCI (Dockhand)

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci # 👈 Changed from 'ci' to just 'tag:ci'

      - name: Rebuild and redeploy on OCI
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 100.68.227.114
          username: opc
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd ~/data/poultryproject
            git pull origin master
            docker compose build poultry-dss
            docker compose up -d --force-recreate poultry-dss
